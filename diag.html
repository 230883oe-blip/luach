<!DOCTYPE html><html><head><meta charset="utf-8"><title>diag</title></head>
<body><pre id="out">start</pre><script>
var API="https://script.google.com/macros/s/AKfycbxVKvYVHOuPGRM8SOZzmygqhuF41uhsPhPMYIfuOFCgN8dIxoQMYgxuuUbb8sxiOYJ6/exec";
var log=[];function w(s){log.push(s);document.getElementById("out").textContent=log.join("\n");}
var t0=Date.now();
fetch(API+"?api=boot&_="+Date.now(),{redirect:"follow"})
 .then(function(r){w("boot status="+r.status+" ms="+(Date.now()-t0));return r.text();})
 .then(function(t){w("boot body(120)="+t.slice(0,120));
   var j=JSON.parse(t);w("boot ok="+j.ok+" class="+j.className);})
 .catch(function(e){w("boot FAIL ms="+(Date.now()-t0)+" err="+e);});
var t1=Date.now();
fetch(API+"?api=board&ym=2026-10&token=&code=&owner=diag&_="+Date.now(),{redirect:"follow"})
 .then(function(r){w("board status="+r.status+" ms="+(Date.now()-t1));return r.json();})
 .then(function(j){w("board ok="+j.ok+" month="+j.monthName);})
 .catch(function(e){w("board FAIL ms="+(Date.now()-t1)+" err="+e);});
</script></body></html>
